<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Loading</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    /* =====================================
       LOADING
    ====================================== */

    .loader {

      width: 46px;
      height: 46px;

      border-radius: 50%;

      border: 4px solid #e5e7eb;

      border-top-color: #2563eb;

      animation: girar 0.8s linear infinite;

    }

    /* =====================================
       ANIMAÇÃO
    ====================================== */

    @keyframes girar {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }

  </style>

</head>

<body>

  <div class="loader"></div>

</body>
</html>
