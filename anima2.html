<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexusOn - Encerramento</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================================
   TELA
========================================= */

.screen {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    background: #ffffff;
}


/* =========================================
   TERMINAL
========================================= */

.terminal {

    position: absolute;

    width: 900px;
    max-width: 80vw;

    padding: 28px 35px;

    background: #0f172a;

    border-radius: 14px;

    box-shadow:
        0 30px 80px rgba(15, 23, 42, .25);

    opacity: 0;

    transform:
        translateY(20px)
        scale(.96);

    animation:
        terminalIn 1s ease forwards;

}


/* =========================================
   BARRA TERMINAL
========================================= */

.terminal-header {

    display: flex;
    align-items: center;

    gap: 8px;

    margin-bottom: 25px;

}

.dot {

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: #64748b;

}

.terminal-title {

    margin-left: 10px;

    color: #94a3b8;

    font-size: 13px;

}


/* =========================================
   TEXTO
========================================= */

.command {

    color: #94a3b8;

    font-size: 18px;

    margin-bottom: 10px;

}

.prompt {

    color: #60a5fa;

}

.url {

    color: #ffffff;

    font-size: 30px;

    font-weight: 500;

    letter-spacing: .3px;

}


/* =========================================
   CURSOR
========================================= */

.cursor {

    display: inline-block;

    width: 9px;
    height: 30px;

    margin-left: 5px;

    background: #2563eb;

    vertical-align: middle;

    animation: blink .8s infinite;

}


/* =========================================
   CLICK
========================================= */

.click {

    position: absolute;

    width: 18px;
    height: 18px;

    border: 2px solid #2563eb;

    border-radius: 50%;

    opacity: 0;

}


/* =========================================
   LOGO FINAL
========================================= */

.final {

    position: absolute;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    opacity: 0;

    transform: scale(.92);

}


/* =========================================
   LOGO
========================================= */

.logo {

    display: flex;

    align-items: center;

    gap: 18px;

}


/* =========================================
   SÍMBOLO
========================================= */

.symbol {

    position: relative;

    width: 78px;
    height: 78px;

    display: flex;

    align-items: center;
    justify-content: center;

}

.ring {

    position: absolute;

    inset: 0;

    border: 4px solid #2563eb;

    border-radius: 22px;

    animation: ringLoop 4s ease-in-out infinite;

}

.core {

    width: 22px;
    height: 22px;

    border-radius: 50%;

    background: #2563eb;

    animation: coreLoop 4s ease-in-out infinite;

}

.connection {

    position: absolute;

    right: 0;
    top: 8px;

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: #60a5fa;

    animation: connectionLoop 4s ease-in-out infinite;

}


/* =========================================
   NOME
========================================= */

.name {

    font-size: 64px;

    font-weight: 700;

    letter-spacing: -3px;

    color: #0f172a;

}

.name span {

    color: #2563eb;

}


/* =========================================
   TEXTO
========================================= */

.tagline {

    margin-top: 28px;

    font-size: 20px;

    line-height: 1.6;

    color: #64748b;

}

.tagline strong {

    display: block;

    margin-top: 6px;

    font-size: 15px;

    letter-spacing: 1.5px;

    color: #2563eb;

}


/* =========================================
   REDES
========================================= */

.socials {

    display: flex;

    gap: 18px;

    margin-top: 20px;

}

.social {

    width: 35px;
    height: 35px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #64748b;

    border: 1px solid #e2e8f0;

    font-size: 13px;

}


/* =========================================
   ANIMAÇÕES
========================================= */

@keyframes terminalIn {

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


@keyframes blink {

    0%,
    50% {

        opacity: 1;

    }

    51%,
    100% {

        opacity: 0;

    }

}


@keyframes ringLoop {

    0% {
        transform: rotate(0deg) scale(1);
    }

    20% {
        transform: rotate(45deg) scale(1.05);
    }

    50% {
        transform: rotate(45deg) scale(1);
    }

    75% {
        transform: rotate(0deg) scale(1.05);
    }

    100% {
        transform: rotate(0deg) scale(1);
    }

}


@keyframes coreLoop {

    0% {
        transform: scale(1);
    }

    20% {
        transform: scale(1.25);
    }

    35% {
        transform: scale(1);
    }

    70% {
        transform: scale(1);
    }

    85% {
        transform: scale(1.25);
    }

    100% {
        transform: scale(1);
    }

}


@keyframes connectionLoop {

    0% {
        transform: translateX(0);
        opacity: .8;
    }

    20% {
        transform: translateX(8px);
        opacity: 1;
    }

    40% {
        transform: translateX(0);
        opacity: .8;
    }

    70% {
        transform: translateX(0);
        opacity: .8;
    }

    85% {
        transform: translateX(8px);
        opacity: 1;
    }

    100% {
        transform: translateX(0);
        opacity: .8;
    }

}


/* =========================================
   ENTRADA DO LOGO
========================================= */

.final.show {

    animation:
        finalIn 1.2s cubic-bezier(.16,1,.3,1)
        forwards;

}


@keyframes finalIn {

    0% {

        opacity: 0;

        transform:
            scale(.85)
            translateY(20px);

    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);

    }

}

</style>

</head>

<body>

<main class="screen">


    <!-- =====================================
         TERMINAL
    ====================================== -->

    <div class="terminal" id="terminal">

        <div class="terminal-header">

            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>

            <span class="terminal-title">
                NexusOn
            </span>

        </div>


        <div class="command">

            <span class="prompt">
                nexus@ngana:~$
            </span>

            &nbsp;

            open

        </div>


        <div class="url">

            <span id="typed"></span>

            <span class="cursor"></span>

        </div>

    </div>



    <!-- =====================================
         LOGO FINAL
    ====================================== -->

    <div class="final" id="final">

        <div class="logo">

            <div class="symbol">

                <span class="ring"></span>

                <span class="core"></span>

                <span class="connection"></span>

            </div>


            <div class="name">

                Nexus<span>On</span>

            </div>

        </div>


        <div class="tagline">

            <div>
                Da Ideia ao Projeto.
                Do Projeto à Solução.
            </div>

            <strong>
                Nexus | Grupo Ngana
            </strong>

        </div>


        <div class="socials">

            <div class="social">
                in
            </div>

            <div class="social">
                f
            </div>

            <div class="social">
                ◎
            </div>

        </div>

    </div>


</main>



<script>

/* =========================================
   CONFIGURAÇÃO
========================================= */

const text =
"nexuson.vercel.app";

const typed =
document.getElementById("typed");

const terminal =
document.getElementById("terminal");

const final =
document.getElementById("final");


/* =========================================
   DIGITAÇÃO
========================================= */

let index = 0;

function typeText() {

    if (index < text.length) {

        typed.textContent += text[index];

        index++;

        setTimeout(typeText, 80);

    } else {

        setTimeout(clickLink, 700);

    }

}


/* =========================================
   CLICK
========================================= */

function clickLink() {

    const click =
    document.createElement("div");

    click.className = "click";

    document.body.appendChild(click);

    click.style.left = "50%";
    click.style.top = "50%";

    click.animate(

        [
            {
                opacity: 0,
                transform: "scale(.5)"
            },

            {
                opacity: 1,
                transform: "scale(1)"
            },

            {
                opacity: 0,
                transform: "scale(1.8)"
            }

        ],

        {
            duration: 450,
            easing: "ease-out"
        }

    );


    setTimeout(showFinal, 550);

}


/* =========================================
   LOGO FINAL
========================================= */

function showFinal() {

    terminal.animate(

        [

            {
                opacity: 1,
                transform: "scale(1)"
            },

            {
                opacity: 0,
                transform: "scale(.96)"
            }

        ],

        {

            duration: 600,
            fill: "forwards",

            easing:
            "cubic-bezier(.4,0,1,1)"

        }

    );


    setTimeout(() => {

        final.classList.add("show");

    }, 350);

}


/* =========================================
   INICIAR
========================================= */

setTimeout(typeText, 900);

</script>

</body>
</html>
