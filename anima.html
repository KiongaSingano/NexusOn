<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NexusOn</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;

      background: #ffffff;

      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================================
       TELA 16:9
    ========================================= */

    .screen {
      width: 100vw;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      overflow: hidden;

      background: #ffffff;
    }

    /* =========================================
       CONTEÚDO
    ========================================= */

    .content {
      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      transform: translateY(-25px);

      /* Aumenta o conjunto inteiro */
      transform-origin: center;
    }

    /* =========================================
       LOGO
    ========================================= */

    .logo {
      display: inline-flex;

      align-items: center;

      gap: 24px;

      text-decoration: none;
    }

    /* =========================================
       SÍMBOLO
    ========================================= */

    .symbol {
      position: relative;

      width: 100px;
      height: 100px;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    /* =========================================
       ANEL
    ========================================= */

    .ring {
      position: absolute;

      inset: 0;

      border: 5px solid #2563eb;

      border-radius: 27px;

      animation: ringLoop 4s ease-in-out infinite;
    }

    /* =========================================
       NÚCLEO
    ========================================= */

    .core {
      position: relative;

      width: 28px;
      height: 28px;

      border-radius: 50%;

      background: #2563eb;

      animation: coreLoop 4s ease-in-out infinite;
    }

    /* =========================================
       CONEXÃO
    ========================================= */

    .connection {
      position: absolute;

      right: 0;
      top: 10px;

      width: 14px;
      height: 14px;

      border-radius: 50%;

      background: #60a5fa;

      animation: connectionLoop 4s ease-in-out infinite;
    }

    /* =========================================
       NOME
    ========================================= */

    .name {
      font-size: 82px;

      font-weight: 700;

      letter-spacing: -4px;

      color: #0f172a;
    }

    .name span {
      color: #2563eb;
    }

    /* =========================================
       FRASE
    ========================================= */

    .tagline {
      margin-top: 38px;

      text-align: center;

      font-size: 25px;

      line-height: 1.6;

      letter-spacing: .3px;

      color: #64748b;
    }

    /* =========================================
       GRUPO NGANA
    ========================================= */

    .tagline strong {
      display: block;

      margin-top: 8px;

      font-size: 18px;

      font-weight: 600;

      letter-spacing: 2px;

      color: #2563eb;
    }

    /* =========================================
       REDES SOCIAIS
    ========================================= */

    .socials {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 22px;

      margin-top: 25px;
    }

    .socials a {
      width: 42px;
      height: 42px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      text-decoration: none;

      color: #64748b;

      font-size: 20px;

      transition:
        color .25s ease,
        background .25s ease,
        transform .25s ease;
    }

    .socials a:hover {
      color: #ffffff;

      background: #2563eb;

      transform: translateY(-3px);
    }

    /* =========================================
       LINKEDIN
    ========================================= */

    .linkedin:hover {
      background: #0a66c2 !important;
    }

    /* =========================================
       FACEBOOK
    ========================================= */

    .facebook:hover {
      background: #1877f2 !important;
    }

    /* =========================================
       INSTAGRAM
    ========================================= */

    .instagram:hover {
      background: #e4405f !important;
    }

    /* =========================================
       ANIMAÇÃO DO ANEL
    ========================================= */

    @keyframes ringLoop {

      0% {
        transform: rotate(0deg) scale(1);
      }

      20% {
        transform: rotate(45deg) scale(1.05);
      }

      50% {
        transform: rotate(45deg) scale(1);
      }

      75% {
        transform: rotate(0deg) scale(1.05);
      }

      100% {
        transform: rotate(0deg) scale(1);
      }

    }

    /* =========================================
       ANIMAÇÃO DO NÚCLEO
    ========================================= */

    @keyframes coreLoop {

      0% {
        transform: scale(1);
      }

      20% {
        transform: scale(1.25);
      }

      35% {
        transform: scale(1);
      }

      70% {
        transform: scale(1);
      }

      85% {
        transform: scale(1.25);
      }

      100% {
        transform: scale(1);
      }

    }

    /* =========================================
       ANIMAÇÃO DA CONEXÃO
    ========================================= */

    @keyframes connectionLoop {

      0% {
        transform: translateX(0);

        opacity: .8;
      }

      20% {
        transform: translateX(8px);

        opacity: 1;
      }

      40% {
        transform: translateX(0);

        opacity: .8;
      }

      70% {
        transform: translateX(0);

        opacity: .8;
      }

      85% {
        transform: translateX(8px);

        opacity: 1;
      }

      100% {
        transform: translateX(0);

        opacity: .8;
      }

    }

  </style>
</head>

<body>

  <main class="screen">

    <div class="content">

      <!-- LOGO -->

      <a href="#" class="logo">

        <span class="symbol">

          <span class="ring"></span>

          <span class="core"></span>

          <span class="connection"></span>

        </span>

        <span class="name">
          Nexus<span>On</span>
        </span>

      </a>


      <!-- TEXTO -->

      <div class="tagline">

        <div>
          Da Ideia ao Projeto. Do Projeto à Solução.
        </div>

        <strong>
          Nexus | Grupo Ngana
        </strong>

      </div>


      <!-- REDES SOCIAIS -->

      <div class="socials">

        <a
          href="#"
          class="linkedin"
          aria-label="LinkedIn"
        >
          <i class="fa-brands fa-linkedin-in"></i>
        </a>

        <a
          href="#"
          class="facebook"
          aria-label="Facebook"
        >
          <i class="fa-brands fa-facebook-f"></i>
        </a>

        <a
          href="#"
          class="instagram"
          aria-label="Instagram"
        >
          <i class="fa-brands fa-instagram"></i>
        </a>

      </div>

    </div>

  </main>

</body>
</html>
